# Buduje firmware radia i publikuje go jako wydanie na GitHubie.
#
# Wydanie, jeden z dwóch sposobów:
#   - wypchnij tag, np. `git tag v1.2.0 && git push origin v1.2.0`;
#   - Actions → Wydanie radia → Run workflow z polem „Wersja” (np. 1.2.0): workflow sam tworzy
#     tag v1.2.0 na zbudowanym commicie i wydanie. Pełne wydanie tylko z gałęzi main.
# Wersja z myślnikiem (1.2.0-beta.1) daje wydanie testowe (prerelease), którego OTA nie bierze jako
# „najnowszego”. Run workflow z pustym polem tylko buduje i zostawia pliki jako artefakt przebiegu.
# Nie twórz wydania na stronie GitHuba (Draft a new release): workflow nie dołoży wtedy plików.
#
# Pliki wydania (stałe nazwy, więc działa adres releases/latest/download/<plik>):
#   radio-app.bin   sam program, do aktualizacji OTA (partycja app0/app1)
#   radio-full.bin  bootloader + tablica partycji + program, wgrywany od 0x0 na czystą płytkę;
#                   nie sięga partycji FFat, więc lista stacji i pliki zostają
#   firmware.json   wersja, wersja mechanizmu OTA (z radio/ota.h), rozmiary i sumy SHA-256
#   versions.tsv    lista wersji dla radia: ta i kilka poprzednich z OTA (tools/release_index.py)
#   SHA256SUMS
name: Wydanie radia

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Wersja do wydania, np. 1.3.0 albo 1.3.0-beta.1 (puste = tylko budowanie)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Wersja
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          RELEASE=0
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            VERSION="${GITHUB_REF_NAME#v}"
            TAG="$GITHUB_REF_NAME"
            RELEASE=1
          elif [ -n "$INPUT_VERSION" ]; then
            VERSION="${INPUT_VERSION#v}"
            TAG="v$VERSION"
            if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
              echo "::error::Wersja \"$INPUT_VERSION\" nie ma postaci 1.2.3 albo 1.2.3-beta.1"; exit 1
            fi
            case "$VERSION" in
              *-*) ;;
              *) if [ "$GITHUB_REF_NAME" != main ]; then
                   echo "::error::Pełne wydanie tylko z gałęzi main (wybrano $GITHUB_REF_NAME); z innej gałęzi wersja z myślnikiem"; exit 1
                 fi ;;
            esac
            if git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null; then
              echo "::error::Tag $TAG już istnieje"; exit 1
            fi
            RELEASE=1
          else
            VERSION="0.0.0-dev+${GITHUB_SHA::7}"
            TAG="$GITHUB_REF_NAME"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "RELEASE=$RELEASE" >> "$GITHUB_ENV"
          printf '#pragma once\n\n// Wygenerowane przez GitHub Actions.\n#define FW_VERSION "%s"\n' "$VERSION" > radio/version.h
          cat radio/version.h

      - uses: arduino/setup-arduino-cli@v2

      # Rdzeń esp32 i biblioteki z profilu w radio/sketch.yaml (ok. 1 GB) — bez pamięci podręcznej
      # każde budowanie pobierałoby je od nowa.
      - uses: actions/cache@v4
        with:
          path: ~/.arduino15
          key: arduino15-${{ runner.os }}-${{ hashFiles('radio/sketch.yaml') }}

      - name: Kompilacja
        run: arduino-cli compile --profile audio-board --output-dir build radio

      - name: Pliki wydania
        run: |
          mkdir dist
          cp build/radio.ino.bin dist/radio-app.bin
          # radio.ino.merged.bin z rdzenia jest dopełniony do 16 MB pustym FFat — wgranie go
          # skasowałoby listę stacji. Program zaczyna się w nim od 0x10000, więc wystarczy uciąć
          # obraz tuż za programem.
          APP_SIZE=$(stat -c %s build/radio.ino.bin)
          head -c $((0x10000 + APP_SIZE)) build/radio.ino.merged.bin > dist/radio-full.bin
          tail -c "$APP_SIZE" dist/radio-full.bin | cmp - build/radio.ino.bin

          # 0 = wersja bez aktualizacji przez sieć; radio takiej nie zainstaluje
          OTA=$(sed -n 's/.*constexpr int PROTOCOL = \([0-9][0-9]*\);.*/\1/p' radio/ota.h)
          cd dist
          entry() { printf '{"file":"%s","size":%d,"sha256":"%s"}' "$1" "$(stat -c %s "$1")" "$(sha256sum "$1" | cut -d' ' -f1)"; }
          printf '{"version":"%s","ota":%d,"board":"waveshare-esp32-s3-audio-board","app":%s,"full":%s}\n' \
            "$VERSION" "${OTA:-0}" "$(entry radio-app.bin)" "$(entry radio-full.bin)" > firmware.json
          cat firmware.json

      - name: Lista wersji
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 tools/release_index.py --repo "$GITHUB_REPOSITORY" --tag "$TAG" \
            --manifest dist/firmware.json --out dist/versions.tsv
          cd dist
          sha256sum radio-app.bin radio-full.bin firmware.json versions.tsv > SHA256SUMS
          ls -l

      - uses: actions/upload-artifact@v4
        with:
          name: radio-${{ env.VERSION }}
          path: dist/

      - name: Wydanie na GitHubie
        if: env.RELEASE == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRE=""
          case "$VERSION" in *-*) PRE="--prerelease" ;; esac
          # Przy uruchomieniu ręcznym tagu jeszcze nie ma: gh tworzy go na zbudowanym commicie. Tag
          # założony tokenem workflow nie uruchamia go ponownie.
          gh release create "$TAG" dist/* --target "$GITHUB_SHA" --title "Radio $VERSION" --generate-notes $PRE
